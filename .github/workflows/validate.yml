name: Validate project

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python
        run: python -m py_compile app.py

      - name: Validate grouped JSON
        run: |
          python - <<'PY'
          import json
          import re
          from collections import Counter
          from pathlib import Path

          data = json.loads(Path("data/words.json").read_text(encoding="utf-8"))
          assert isinstance(data, dict) and isinstance(data.get("themes"), dict), "words.json must contain a themes object"
          themes = data["themes"]
          assert themes, "themes cannot be empty"

          all_words = []
          for theme, items in themes.items():
              assert isinstance(theme, str) and theme.strip(), "theme names must be non-empty"
              assert isinstance(items, list) and len(items) == 30, f"theme '{theme}' must contain exactly 30 words"
              normalized = []
              for item in items:
                  assert isinstance(item, dict), f"invalid entry in theme '{theme}'"
                  word = str(item.get("word", "")).strip()
                  assert word, f"empty word in theme '{theme}'"
                  difficulty = item.get("difficulty")
                  assert isinstance(difficulty, int) and 1 <= difficulty <= 7, f"invalid difficulty for '{word}'"
                  language = str(item.get("language", "")).strip().lower()
                  assert language, f"missing language for '{word}'"
                  hints = item.get("hints")
                  assert isinstance(hints, list) and len(hints) == 3 and all(str(h).strip() for h in hints), f"'{word}' must have exactly 3 hints"
                  translations = item.get("translations", {})
                  assert isinstance(translations, dict), f"translations for '{word}' must be an object"
                  supported = {"pt", "en", "es", "fr", "de", "it", "ja", "ko", "zh", "ru"}
                  assert set(translations).issubset(supported - {"pt"}), f"unsupported translation code for '{word}'"
                  assert all(isinstance(v, str) and v.strip() for v in translations.values()), f"empty translation for '{word}'"
                  key = re.sub(r"\s+", " ", word.casefold().strip())
                  normalized.append(key)
                  all_words.append((theme, key))
              duplicates = [w for w, count in Counter(normalized).items() if count > 1]
              assert not duplicates, f"duplicate words inside theme '{theme}': {duplicates}"

          frontend = Path("static/script.js").read_text(encoding="utf-8")
          html = Path("index.html").read_text(encoding="utf-8")
          listed_themes = re.findall(r'\["[^"]*","([^"]+)"\]', frontend.split("const THEMES=", 1)[1].split("];", 1)[0])
          assert set(listed_themes) == set(themes), "frontend themes and words.json themes are out of sync"

          language_codes = re.findall(r'\["([a-z]{2})","[^"]+"\]', frontend.split("const LANGUAGES=", 1)[1].split("];", 1)[0])
          assert language_codes == ["pt", "en", "es", "fr", "de", "it", "ja", "ko", "zh", "ru"], "language list must contain exactly the 10 supported languages"
          assert "static/style.css" in html and "static/script.js" in html, "static entrypoint references are missing"
          assert "data/words.json" in frontend, "frontend must load the word database"

          print(f"words.json OK: {len(themes)} themes, {sum(len(v) for v in themes.values())} words")
          PY

      - name: Validate JavaScript syntax
        run: node --check static/script.js

      - name: Validate Flask API filters
        run: |
          python - <<'PY'
          import os
          os.environ.setdefault("FORCA_ADMIN_PASSWORD", "test-password")
          from app import app

          client = app.test_client()

          health = client.get("/api/health")
          assert health.status_code == 200 and health.json["status"] == "ok"

          themed = client.get("/api/word?theme=Anime&language=pt&difficulty=3")
          assert themed.status_code == 200
          assert themed.json["theme"] == "Anime"
          assert themed.json["language"] == "pt"
          assert int(themed.json["difficulty"]) <= 4

          bad_theme = client.get("/api/word?theme=__NAO_EXISTE__")
          assert bad_theme.status_code == 404

          localized = client.get("/api/word?theme=Animais&language=en")
          assert localized.status_code == 200
          assert localized.json["language"] == "en"
          assert localized.json["word"] in {
              "dog", "cat", "penguin", "giraffe", "dolphin", "octopus",
              "platypus", "axolotl", "saiga", "lion", "tiger", "elephant",
              "zebra", "wolf", "fox", "bear", "rabbit", "horse", "cow",
              "pig", "chicken", "eagle", "owl", "shark", "whale",
              "turtle", "crocodile", "chameleon", "monkey", "jaguar"
          }

          bad_language = client.get("/api/word?theme=Anime&language=xx")
          assert bad_language.status_code == 400

          invalid_difficulty = client.get("/api/word?theme=Anime&difficulty=abc")
          assert invalid_difficulty.status_code == 400

          admin = client.post("/api/admin/check", json={"password": "test-password"})
          assert admin.status_code == 200 and admin.json["valid"] is True

          translated = client.post("/api/translate", json={"text": "olá amigo", "source": "pt", "target": "en"})
          assert translated.status_code == 200
          assert translated.json["translated"] is True
          assert translated.json["text"].lower() == "hello friend"

          unknown = client.post("/api/translate", json={"text": "texto não cadastrado", "source": "pt", "target": "en"})
          assert unknown.status_code == 200
          assert unknown.json["translated"] is False
          assert unknown.json["text"] == "texto não cadastrado"

          print("Flask API smoke tests OK")
          PY
