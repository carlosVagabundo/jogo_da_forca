name: Validate project

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python
        run: python -m py_compile app.py

      - name: Validate grouped JSON
        run: python -c "import json; d=json.load(open('data/words.json', encoding='utf-8')); assert isinstance(d, dict) and isinstance(d.get('themes'), dict); assert len(d['themes']) == 18; assert all(isinstance(v, list) and v for v in d['themes'].values()); assert all(len(x.get('hints', [])) == 3 for v in d['themes'].values() for x in v); print('words.json OK')"

      - name: Validate JavaScript syntax
        run: node --check static/script.js

      - name: Validate static entrypoint
        run: python -c "from pathlib import Path; html=Path('index.html').read_text(encoding='utf-8'); assert 'static/style.css' in html and 'static/script.js' in html and 'data/words.json' in open('static/script.js', encoding='utf-8').read(); print('static entrypoint OK')"