<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jogo da Forca Ultimate</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main>
<header class="top"><div><h1>⌛ Jogo da Forca Ultimate</h1><p>Versão modular com Python + HTML + CSS + JavaScript</p></div><strong id="status">Menu</strong></header>
<section id="menu" class="card"><h2>Escolha o modo</h2><div class="mode-grid"><button class="mode" data-mode="friends">👥<b>Jogar com amigos</b><span>Defina a palavra e as dicas.</span></button><button class="mode" data-mode="random">🎲<b>Aleatório</b><span>Palavras contextualizadas por tema.</span></button><button class="mode" data-mode="endless">♾️<b>Aleatório crescente</b><span>Sequência infinita com dificuldade crescente.</span></button></div></section>
<section id="config" class="card hidden"><h2>Configurações</h2><div class="config-grid"><label>Tempo<select id="time"><option value="30">30 segundos</option><option value="60">1 minuto</option><option value="180">3 minutos</option><option value="300">5 minutos</option><option value="600">10 minutos</option><option value="1800">30 minutos</option><option value="3600">60 minutos</option><option value="inf">Tempo infinito</option></select></label><label>Idioma<select id="lang"><option value="pt">🇧🇷 Português</option><option value="en">🇺🇸 English</option><option value="es">🇪🇸 Español</option><option value="fr">🇫🇷 Français</option><option value="de">🇩🇪 Deutsch</option><option value="it">🇮🇹 Italiano</option><option value="ja">🇯🇵 日本語</option><option value="ko">🇰🇷 한국어</option><option value="zh">🇨🇳 中文</option><option value="ru">🇷🇺 Русский</option><option value="tr">🇹🇷 Türkçe</option><option value="ar">🇸🇦 العربية</option></select></label><label>Palavra<input id="custom" placeholder="Usada no modo com amigos"></label><label>Jogador<input id="player" placeholder="Jogador"></label></div><h3>Tema</h3><div id="themes" class="options"></div><h3>Dificuldade</h3><div id="diffs" class="options"></div><div class="translator"><h3>Tradutor</h3><div class="config-grid"><label>Origem<select id="from"><option value="pt">Português</option><option value="en">Inglês</option><option value="es">Espanhol</option><option value="fr">Francês</option></select></label><label>Destino<select id="to"><option value="en">Inglês</option><option value="pt">Português</option><option value="es">Espanhol</option><option value="fr">Francês</option></select></label><label>Texto<input id="trText"></label><label>Resultado<input id="trResult" readonly></label></div><button id="translate">🌐 Traduzir</button></div><div class="actions"><button id="start">▶ Começar</button><button class="secondary" id="back">Voltar</button></div></section>
<section id="game" class="hidden"><div class="stats"><div>⏱️ <b id="timer">∞</b><small>Tempo</small></div><div>❌ <b id="errors">0/8</b><small>Erros</small></div><div>⭐ <b id="score">0</b><small>Pontos</small></div><div>🔥 <b id="streak">0</b><small>Sequência</small></div></div><div class="card"><div id="hang" class="hang">🙂</div><div id="word" class="word"></div><div id="hints"></div><div id="keys" class="keys"></div><p class="muted">Use também o teclado físico.</p></div><div class="card admin"><div class="admin-head"><b>🔐 Painel Admin</b><button class="secondary" id="toggleAdmin">Abrir/fechar</button></div><div id="adminBody" class="hidden"><input id="adminPass" type="password" placeholder="Senha do admin"><button id="unlock">Desbloquear</button><div id="adminControls" class="hidden actions"><button data-add="10">+10s</button><button data-add="20">+20s</button><button data-add="30">+30s</button><button id="reveal">Revelar</button><button id="removeError">Remover erro</button><button id="nextHint">Liberar dica</button><button id="addScore">+100 pontos</button><button id="resetRound">Reiniciar</button></div></div></div></section>
<section id="result" class="card result hidden"><div id="resultIcon"></div><h2 id="resultTitle"></h2><p id="resultText"></p><button id="again">🔄 Jogar novamente</button><button class="secondary" id="exit">🚪 Sair</button></section>
</main><script src="{{ url_for('static', filename='script.js') }}"></script></body></html>
